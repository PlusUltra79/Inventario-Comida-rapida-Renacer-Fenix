<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contabilidad Comida Fast</title><meta name="theme-color" content="#070d27">
<style>
:root{--bg:#f5f5eb;--card:#fffefa;--tx:#1e2b33;--mut:#667078;--pri:#d4393f;--pri2:#fff;--acc:#e8a63a;--ok:#2f9e66;--bad:#b3262b;--bd:#e6e2cf;--sh:0 4px 14px #1e2b3318;--navy:#1e2b33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a20;--card:#1c2830;--tx:#f5f5eb;--mut:#a3adb4;--bd:#2d3d48;--pri:#ff5a5f;--pri2:#fff;--acc:#f0b445;--sh:0 4px 14px #0008}}
:root[data-theme="dark"]{--bg:#121a20;--card:#1c2830;--tx:#f5f5eb;--mut:#a3adb4;--bd:#2d3d48;--pri:#ff5a5f;--acc:#f0b445;--sh:0 4px 14px #0008}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-bottom:100px}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:6px 0;font-weight:900;letter-spacing:.3px;color:var(--pri)}h2{font-size:15px;margin:22px 0 8px;text-transform:uppercase;letter-spacing:1.2px;color:var(--mut)}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--sh)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.big{font-size:26px;font-weight:900}
button{font:inherit;border:0;border-radius:14px;padding:10px 16px;background:linear-gradient(135deg,#e5484d,#c22f36);color:#fff;font-weight:800;cursor:pointer;transition:transform .12s,filter .15s}
button:hover{filter:brightness(1.08)}button:active{transform:scale(.94)}
button.sec{background:transparent;box-shadow:none;color:var(--tx);border:2px solid var(--bd)}
button.bad{background:var(--bad);color:#fff}
button:disabled{opacity:.5}button.sm{padding:7px 12px;font-size:14px}
button.rd{width:42px;height:42px;padding:0;border-radius:50%;font-size:22px;line-height:1}
input,select,textarea{font:inherit;width:100%;padding:11px;border-radius:12px;border:2px solid var(--bd);background:var(--bg);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:0 6px 24px #3a1a0a40;display:flex;padding:6px;gap:2px}
nav button{flex:1;background:none;color:var(--mut);border-radius:18px;padding:6px 0;font-size:11px;font-weight:700;box-shadow:none}
nav button div{font-size:21px;transition:transform .2s}
nav button.on{background:var(--acc);color:#1e2b33}nav button.on div{transform:translateY(-2px) scale(1.18)}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--acc);color:#1e2b33;font-weight:800}
.low{color:var(--bad);font-weight:800}.okc{color:var(--ok)}
.empty{text-align:center;color:var(--mut);padding:24px 8px}
.hero{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;color:#fff;background:linear-gradient(135deg,#1e2b33,#2f4350);box-shadow:var(--sh);margin-bottom:10px}
.hero:before,.hero:after{content:'';position:absolute;height:5px;border-radius:9px;background:var(--pri);right:-30px;opacity:.9;animation:dash 2.8s ease-in-out infinite}.hero:before{width:120px;top:22px}.hero:after{width:80px;bottom:24px;background:var(--acc);animation-delay:-1.4s}
.logo{flex:none;width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:36px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand{font-size:26px;font-weight:900;line-height:1;font-style:italic;text-shadow:3px 3px 0 var(--pri)}.tag2{font-size:12px;color:var(--acc);text-transform:uppercase;letter-spacing:2.5px;font-weight:800;margin-top:4px}.dt{font-size:12px;opacity:.85;margin-top:4px}
.fl{position:absolute;font-size:26px;opacity:.55;animation:float 4s ease-in-out infinite}.f1{right:12px;top:8px}.f2{right:44px;bottom:6px;animation-delay:-1.3s}.f3{right:6px;bottom:30px;animation-delay:-2.6s}
.em{font-size:20px;margin-right:8px}.nm{display:flex;align-items:center;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--bd);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ok),#94d82d);transition:width .5s}.bar i.lo{background:linear-gradient(90deg,var(--bad),#ff8787)}
.tile{display:flex;align-items:center;gap:12px}.big-em{font-size:34px;margin:0}.ti{flex:1;min-width:0}
.qty{display:flex;align-items:center;gap:10px}.cnt{min-width:30px;text-align:center;font-size:22px;font-weight:900}
.tapped{border-color:var(--acc);box-shadow:0 0 0 3px #fcc41955,var(--sh)}.tapped .cnt{animation:pop .3s}
dialog{border:0;border-radius:22px;padding:16px;width:min(92vw,460px);background:var(--card);color:var(--tx);max-height:88vh;overflow:auto;animation:fade .2s}
dialog::backdrop{background:#0c1419bb}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:14px;display:none;z-index:9;max-width:90vw;font-weight:700;box-shadow:var(--sh)}
.drop{position:fixed;top:-40px;font-size:26px;pointer-events:none;animation:fall 2.6s linear forwards}
#app.in>*{animation:rise .35s both}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.quick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 4px;font-size:13px;border-radius:18px}.quick button span{font-size:28px}.quick button:nth-child(2){background:linear-gradient(135deg,#f0b445,#e0922e);color:#1e2b33}.quick button:nth-child(3){background:linear-gradient(135deg,#2f4350,#1e2b33)}
#splash{position:fixed;inset:0;z-index:99;background:#f5f5eb;display:flex;align-items:center;justify-content:center;transition:opacity .45s}#splash.out{opacity:0;pointer-events:none}#splash img{width:min(70vw,340px);mix-blend-mode:multiply;animation:zoom .9s cubic-bezier(.2,1.4,.4,1) both}
.pr{position:fixed;z-index:50;font-weight:900;color:var(--ok);pointer-events:none;animation:up .9s ease-out forwards;font-size:20px}
.credit{text-align:center;font-size:11px;line-height:1.6;color:var(--mut);opacity:.8;margin:30px 0 6px;letter-spacing:.4px}.credit b{color:var(--pri);font-weight:800}.spc{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));margin:0;color:#667078}
@keyframes zoom{from{opacity:0;transform:scale(.6) rotate(-6deg)}}@keyframes dash{50%{transform:translateX(-24px)}}@keyframes up{to{transform:translateY(-60px);opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}@keyframes fade{from{opacity:0}}
@keyframes pop{50%{transform:scale(1.5);color:var(--pri)}}@keyframes float{50%{transform:translateY(-8px) rotate(8deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== EL RENACER DEL FÉNIX · tema ===== */
:root,:root[data-theme]{color-scheme:dark;--bg:#070d27;--card:#101a47;--tx:#fff3e0;--mut:#9fb2e6;--pri:#ff7a18;--acc:#ffc233;--ok:#35e0a1;--bad:#ff5a5f;--bd:#233470;--sh:0 6px 18px #0009;--glow:#ff7a1855}
body{background:radial-gradient(900px 500px at 8% -10%,#1b3a9e66,transparent),radial-gradient(700px 420px at 100% 0,#ff7a1830,transparent),var(--bg);background-attachment:fixed}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:url("data:image/svg+xml,%3Csvg width='28' height='49' viewBox='0 0 28 49' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%232f56d6' fill-opacity='.16' d='M13.99 9.25l13 7.5v15l-13 7.5L1 31.75v-15l12.99-7.5zM3 17.9v12.7l10.99 6.34 11-6.35V17.9l-11-6.34L3 17.9zM0 15l12.98-7.5V0h-2v6.35L0 12.69v2.3zm0 18.5L12.98 41v8h-2v-6.85L0 35.81v-2.3zM15 0v7.5L27.99 15H28v-2.31h-.01L17 6.35V0h-2zm0 49v-8l12.99-7.5H28v2.31h-.01L17 42.15V49h-2z'/%3E%3C/svg%3E")}
body:after{content:'';position:fixed;left:0;right:0;top:28%;height:3px;z-index:-1;pointer-events:none;background:linear-gradient(90deg,transparent,#3d7bff,transparent);box-shadow:0 0 22px 5px #2f6bff77;opacity:.5;animation:scan 8s ease-in-out infinite}
@keyframes scan{50%{top:72%}}
h1{color:var(--acc);text-shadow:0 0 18px #ff7a1866}
.card{background:linear-gradient(160deg,var(--card),#0b1438);transition:transform .2s,border-color .2s,box-shadow .2s}
.card:active{transform:scale(.985)}.tile:hover,.tapped{border-color:var(--pri)}
button{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff9a1f,#ee4d0b);box-shadow:0 4px 14px #ff7a1838}
button.sec{background:transparent;box-shadow:none}button.bad{background:#d62839}
.quick button:nth-child(3){background:linear-gradient(135deg,#3d7bff,#1a2f9e);color:#fff}
nav{background:#0d1640ee;backdrop-filter:blur(10px);border-color:#2f4fb8}
nav button.on{background:linear-gradient(135deg,var(--acc),var(--pri));box-shadow:0 0 16px #ff7a1877}
.hero{background:linear-gradient(135deg,#0b1a52,#1a3fae 62%,#c2410c);border:1px solid #ffffff24}
.logo{width:80px;height:80px;background:transparent;border:0;box-shadow:0 0 0 3px var(--acc),0 0 24px 6px var(--glow);animation:glow 2.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--acc),0 0 36px 12px #ff7a1899}}
.brand{font-size:21px;text-shadow:2px 2px 0 #c2410c,0 0 14px #ffb34766}
.em2{position:absolute;bottom:-8px;width:5px;height:5px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px 2px var(--pri);opacity:0;animation:ember 3.5s ease-in infinite}
@keyframes ember{0%{opacity:0;transform:translateY(0)}15%{opacity:.95}100%{opacity:0;transform:translateY(-130px) translateX(var(--dx)) scale(.3)}}
.bar i{background:linear-gradient(90deg,var(--ok),#a6ffdc,var(--ok));background-size:200% 100%;animation:shine 2.2s linear infinite}
.bar i.lo{background:linear-gradient(90deg,var(--bad),#ffb3b3,var(--bad));background-size:200% 100%}
@keyframes shine{to{background-position:-200% 0}}
.rp{position:absolute;border-radius:50%;background:#fff6;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(3);opacity:0}}
.pays{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.pays button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 6px;border-radius:18px;animation:rise .35s both}
.pays button span{font-size:30px}.pays button:last-child{grid-column:1/-1}
#splash{background:radial-gradient(circle at 50% 45%,#1a3fae,#070d27 70%)}
#splash img{mix-blend-mode:normal;border-radius:50%;box-shadow:0 0 60px 14px #ff7a1877;animation:zoom .9s cubic-bezier(.2,1.4,.4,1) both,glow 2.6s 1s infinite}
#splash .spc{color:var(--mut)}
#app.in>*:nth-child(1){animation-delay:45ms}#app.in>*:nth-child(2){animation-delay:90ms}#app.in>*:nth-child(3){animation-delay:135ms}#app.in>*:nth-child(4){animation-delay:180ms}#app.in>*:nth-child(5){animation-delay:225ms}#app.in>*:nth-child(6){animation-delay:270ms}#app.in>*:nth-child(7){animation-delay:315ms}#app.in>*:nth-child(8){animation-delay:360ms}#app.in>*:nth-child(9){animation-delay:405ms}#app.in>*:nth-child(10){animation-delay:450ms}#app.in>*:nth-child(11){animation-delay:495ms}#app.in>*:nth-child(12){animation-delay:540ms}#app.in>*:nth-child(13){animation-delay:585ms}#app.in>*:nth-child(14){animation-delay:630ms}#app.in>*:nth-child(15){animation-delay:675ms}</style>

<body>
<main id="app"></main>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<nav id="nav"></nav>
<script>
const KEY='controlpuesto.v1';
const blank=()=>({cur:'$',products:[],combos:[],sales:[],purchases:[],closes:[],adjusts:[],lastBackup:''});
let S=blank(),tab='inicio';
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('No se pudo guardar en este navegador')}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const n=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?0:x};
const fmt=v=>Math.round(v*100)/100;
const money=v=>S.cur+fmt(v).toLocaleString('es');
const unit=p=>p.unit==='kg'?'kg':'pza';
const prod=id=>S.products.find(p=>p.id===id);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)}
function dlg(html){const d=$('dlg');d.innerHTML=html;d.showModal()}
const closeDlg=()=>$('dlg').close();

const TABS=[['inicio','🏠','Inicio'],['vender','🌭','Vender'],['comprar','🛒','Comprar'],['catalogo','📦','Catálogo'],['cierre','🧾','Cierre'],['reportes','📊','Reportes']];
function nav(){ $('nav').innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="go('${t[0]}')"><div style="font-size:20px">${t[1]}</div>${t[2]}</button>`).join('') }
function go(t){lastTap='';tab=t;render();scrollTo(0,0);const a=$('app');a.classList.remove('in');void a.offsetWidth;a.classList.add('in');countUps()}
function render(){nav();$('app').innerHTML=({inicio,vender,comprar,catalogo,cierre,reportes})[tab]()+credit()}

const BRAND='El Renacer del Fénix',TAGLINE='Comida rápida',DEV='MoussaCorp.',YEAR=2026;

let lastTap='';
function emo(n){n=n.toLowerCase();const m=[[/hamburg|burger/,'🍔'],[/perro|hot|salchich|combo|sencillo|doble/,'🌭'],[/pan/,'🥖'],[/papa|fri/,'🍟'],[/refresc|soda|cola|malta|jugo|bebida/,'🥤'],[/queso/,'🧀'],[/repollo|ensalada|lechuga/,'🥬'],[/pollo|alita/,'🍗'],[/tocino|bacon/,'🥓'],[/huevo/,'🥚'],[/salsa|ketchup|mostaza|mayo/,'🥫'],[/cebolla/,'🧅'],[/tomate/,'🍅'],[/pizza/,'🍕'],[/helado/,'🍦'],[/agua/,'💧'],[/cerveza/,'🍺']];for(const [r,e] of m)if(r.test(n))return e;return '🍽️'}
function hero(){return `<div class="hero"><div class="logo">${LOGO?`<img src="${LOGO}" alt="Logo">`:'🌭'}</div><div><div class="brand">${esc(BRAND)}</div><div class="tag2">${esc(TAGLINE)}</div><div class="dt">Hoy, ${today()}</div></div>${embers()}<span class="fl f1">🍔</span><span class="fl f2">🍟</span><span class="fl f3">🥤</span></div>`}
function stockCard(p){const low=p.stock<=p.min,pct=Math.max(0,Math.min(100,p.stock/(Math.max(p.min,1)*3)*100));return `<div class="card"><div class="row"><span class="nm"><span class="em">${emo(p.name)}</span>${esc(p.name)}</span><b class="${low?'low':''}">${low?'⚠ ':''}${fmt(p.stock)} ${unit(p)}</b></div><div class="bar"><i class="${low?'lo':''}" style="width:${pct}%"></i></div></div>`}
function rain(){const d=$('dlg');['🔥','🌭','🍔','✨','🎉','⭐'].forEach((e,i)=>{for(let k=0;k<3;k++){const x=document.createElement('span');x.className='drop';x.textContent=e;x.style.left=Math.random()*95+'vw';x.style.animationDelay=(Math.random()*1.2)+'s';d.appendChild(x);setTimeout(()=>x.remove(),4200)}})}
function price0(t,id){const x=t==='combo'?S.combos.find(c=>c.id===id):prod(id);return x?x.price:0}
function countUps(){document.querySelectorAll('[data-cu]').forEach(el=>{const v=n(el.dataset.cu),t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);el.textContent=money(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}
function splash(){const d=document.createElement('div');d.id='splash';d.innerHTML=`<img src="${LOGO_FULL}" alt="${esc(BRAND)}"><div class="credit spc">Desarrollado por <b>${esc(DEV)}</b> · ${YEAR}</div>`;document.body.appendChild(d);const off=()=>{d.classList.add('out');setTimeout(()=>d.remove(),500)};d.onclick=off;setTimeout(off,1300)}
/* ---------- INICIO ---------- */
function todaySales(){return S.sales.filter(s=>s.date===today())}
function inicio(){
  const ts=todaySales(),rev=ts.reduce((a,s)=>a+s.amount,0);
  const low=S.products.filter(p=>p.stock<=p.min);
  let h=`${hero()}${bkBanner()}
  <div class="grid"><div class="card"><div class="mut">Vendido hoy</div><div class="big" data-cu="${rev}">${money(rev)}</div></div>
  <div class="card"><div class="mut">Ventas registradas</div><div class="big">${ts.reduce((a,s)=>a+s.qty,0)}</div></div></div>`;
  if(!S.products.length) return h+`<div class="card empty">Aún no hay productos.<br>Crea el primero en <b>Catálogo</b> o carga datos de ejemplo.<br><br><button onclick="demo()">Cargar datos de ejemplo</button></div>`+extras();
  h+=`<div class="quick"><button onclick="go('vender')"><span>🌭</span>Vender</button><button onclick="go('comprar')"><span>🛒</span>Comprar</button><button onclick="go('cierre')"><span>🧾</span>Cerrar día</button></div>${payBreak(ts)}<h2>Qué comprar</h2>`;
  h+=low.length?low.map(p=>`<div class="card row"><span>${esc(p.name)}</span><span class="low">${fmt(p.stock)} ${unit(p)} (mín. ${p.min})</span></div>`).join(''):`<div class="card okc">Todo el stock está por encima del mínimo ✓</div>`;
  h+=`<h2>Stock actual</h2>`+S.products.map(p=>`${stockCard(p)}`).join('');
  return h+extras();
}
function extras(){
  const sales=S.closes.slice().reverse().slice(0,10);
  let h=`<h2>Historial de cierres</h2>`;
  h+=sales.length?sales.map(c=>`<div class="card"><div class="row"><b>${c.date}</b><b>${money(c.revenue)}</b></div><div class="mut">Ganancia estimada: ${money(c.profit)} · Diferencias: ${c.diffs.length}</div></div>`).join(''):`<div class="empty">Aún no hay cierres. Cierra tu primer día en la pestaña Cierre.</div>`;
  h+=`<h2>Ajustes</h2><div class="card"><div class="row"><span>Moneda</span><button class="sec sm" onclick="setCur()">${esc(S.cur)} · Cambiar</button></div><div class="row" style="margin-top:10px"><span>Respaldo<br><span class="mut">Último: ${S.lastBackup||'nunca'}</span></span><span><button class="sec sm" onclick="bkForm()">Exportar</button> <button class="sec sm" onclick="impForm()">Importar</button></span></div><div class="row" style="margin-top:10px"><span>Borrar todo</span><button class="bad sm" onclick="wipe()">Borrar datos</button></div></div>`;
  return h;
}
function setCur(){const c=prompt('Símbolo de moneda (ej. $, Bs, S/)',S.cur);if(c){S.cur=c.slice(0,4);save();render()}}
function wipe(){if(confirm('¿Borrar TODOS los datos? Esta acción no se puede deshacer.')){S=blank();save();render()}}
function demo(){
  const P=(name,unit,cost,price,min,stock)=>({id:uid(),name,unit,cost,price,min,stock});
  const pan=P('Pan','pza',0.3,0,20,100),sal=P('Salchicha','pza',0.5,0,20,100),ref=P('Refresco','pza',0.6,1.5,10,48),mal=P('Malta','pza',0.7,1.5,10,36),que=P('Queso rallado','kg',6,0,0.5,3),rep=P('Repollo','kg',1,0,1,5);
  S.products=[pan,sal,ref,mal,que,rep];
  const it=(p,q)=>({pid:p.id,qty:q});
  S.combos=[{id:uid(),name:'Perro Sencillo',price:2,items:[it(pan,1),it(sal,1)]},{id:uid(),name:'Combo Doble',price:5,items:[it(pan,2),it(sal,2),it(ref,1)]},{id:uid(),name:'Combo Malta',price:4,items:[it(pan,1),it(sal,1),it(mal,1)]}];
  save();render();toast('Datos de ejemplo cargados')
}

/* ---------- CATÁLOGO ---------- */

  let h=`<div class="row"><h1>Catálogo</h1></div><div class="row"><h2>Productos</h2><button class="sm" onclick="prodForm()">+ Nuevo</button></div>`;
  h+=S.products.length?S.products.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="tag">${unit(p)}</span></div>
  <div class="mut">Stock ${fmt(p.stock)} · Mín. ${p.min} · Costo ${money(p.cost)} · ${p.price>0?'Venta suelta '+money(p.price):'No se vende suelto'}</div>
  <div style="margin-top:8px"><button class="sec sm" onclick="prodForm('${p.id}')">Editar</button> <button class="sec sm" onclick="adjForm('${p.id}')">Ajustar stock</button> <button class="sec sm" onclick="delProd('${p.id}')">Eliminar</button></div></div>`).join(''):`<div class="empty">Aún no hay productos. Crea el primero para comenzar.</div>`;
  h+=`<div class="row"><h2>Combos</h2><button class="sm" onclick="comboForm()">+ Nuevo</button></div>`;
  h+=S.combos.length?S.combos.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b><b>${money(c.price)}</b></div>
  <div class="mut">${c.items.map(i=>{const p=prod(i.pid);return p?`${i.qty} ${esc(p.name)}`:''}).filter(Boolean).join(' + ')}</div>
  <div style="margin-top:8px"><button class="sec sm" onclick="comboForm('${c.id}')">Editar</button> <button class="sec sm" onclick="delCombo('${c.id}')">Eliminar</button></div></div>`).join(''):`<div class="empty">Aún no hay combos. ${S.products.length?'Crea el primero.':'Primero agrega productos.'}</div>`;
  return h;
}
function prodForm(id){
  const p=id?prod(id):{name:'',unit:'pza',cost:'',price:'',min:0,stock:0};
  dlg(`<h2>${id?'Editar':'Nuevo'} producto</h2>
  <label>Nombre</label><input id="f_n" value="${esc(p.name)}" placeholder="Ej. Salchicha">
  <label>Se mide en</label><select id="f_u"><option value="pza" ${p.unit==='pza'?'selected':''}>Unidades (pza)</option><option value="kg" ${p.unit==='kg'?'selected':''}>Kilogramos (kg)</option></select>
  <label>Costo por unidad/kg</label><input id="f_c" inputmode="decimal" value="${p.cost}">
  <label>Precio de venta suelto (déjalo vacío si no se vende solo)</label><input id="f_p" inputmode="decimal" value="${p.price||''}">
  <label>Avisar cuando quede (stock mínimo)</label><input id="f_m" inputmode="decimal" value="${p.min}">
  ${id?'':`<label>Stock inicial</label><input id="f_s" inputmode="decimal" value="${p.stock}">`}
  <div class="row" style="margin-top:14px"><button class="sec" onclick="closeDlg()">Cancelar</button><button onclick="saveProd('${id||''}')">Guardar</button></div>`);
}
function saveProd(id){
  const name=$('f_n').value.trim();if(!name)return toast('Escribe el nombre del producto');
  if(S.products.some(p=>p.id!==id&&p.name.toLowerCase()===name.toLowerCase()))return toast('Ya existe un producto con ese nombre');
  const d={name,unit:$('f_u').value,cost:n($('f_c').value),price:n($('f_p').value),min:n($('f_m').value)};
  if([d.cost,d.price,d.min].some(x=>x<0))return toast('No se permiten números negativos');
  if(id)Object.assign(prod(id),d);else S.products.push({id:uid(),stock:Math.max(0,n($('f_s').value)),...d});
  save();closeDlg();render();toast('Producto guardado')
}
function delProd(id){
  if(S.combos.some(c=>c.items.some(i=>i.pid===id)))return toast('Está dentro de un combo. Quítalo del combo primero');
  if(confirm('¿Eliminar este producto?')){S.products=S.products.filter(p=>p.id!==id);save();render()}
}
function comboForm(id){
  if(!S.products.length)return toast('Primero crea productos');
  const c=id?S.combos.find(x=>x.id===id):{name:'',price:'',items:[]};
  dlg(`<h2>${id?'Editar':'Nuevo'} combo</h2>
  <label>Nombre</label><input id="c_n" value="${esc(c.name)}" placeholder="Ej. Combo Doble">
  <label>Precio de venta</label><input id="c_p" inputmode="decimal" value="${c.price}">
  <label>Cantidad de cada producto que lleva</label>
  ${S.products.map(p=>{const it=c.items.find(i=>i.pid===p.id);return `<div class="row" style="margin:6px 0"><span>${esc(p.name)} <span class="mut">(${unit(p)})</span></span><input style="width:90px" data-pid="${p.id}" inputmode="decimal" value="${it?it.qty:''}" placeholder="0"></div>`}).join('')}
  <div class="row" style="margin-top:14px"><button class="sec" onclick="closeDlg()">Cancelar</button><button onclick="saveCombo('${id||''}')">Guardar</button></div>`);
}
function saveCombo(id){
  const name=$('c_n').value.trim(),price=n($('c_p').value);
  const items=[...document.querySelectorAll('[data-pid]')].map(e=>({pid:e.dataset.pid,qty:n(e.value)})).filter(i=>i.qty>0);
  if(!name)return toast('Escribe el nombre del combo');
  if(price<=0)return toast('Pon un precio mayor a 0');
  if(!items.length)return toast('El combo necesita al menos un producto');
  if(id)Object.assign(S.combos.find(x=>x.id===id),{name,price,items});else S.combos.push({id:uid(),name,price,items});
  save();closeDlg();render();toast('Combo guardado')
}
function delCombo(id){if(confirm('¿Eliminar este combo?')){S.combos=S.combos.filter(c=>c.id!==id);save();render()}}

/* ---------- COMPRAR ---------- */
function comprar(){
  if(!S.products.length)return `<h1>Comprar mercancía</h1><div class="card empty">Primero crea productos en Catálogo.</div>`;
  const rec=S.purchases.slice().reverse().slice(0,8);
  return `<h1>Comprar mercancía</h1><div class="mut">La cantidad se suma al stock actual.</div>
  <div class="card"><label>Producto</label><select id="b_p" onchange="buyHint()">${S.products.map(p=>`<option value="${p.id}">${esc(p.name)} (${unit(p)})</option>`).join('')}</select>
  <div class="mut" id="b_h"></div>
  <label>Cantidad comprada</label><input id="b_q" inputmode="decimal" placeholder="0">
  <label>Costo total pagado (opcional)</label><input id="b_c" inputmode="decimal" placeholder="0">
  <button style="width:100%;margin-top:12px" onclick="buy()">Agregar al stock</button></div>
  <h2>Últimas compras</h2>`+(rec.length?rec.map(b=>{const p=prod(b.pid);return `<div class="card row"><span>${p?esc(p.name):'(eliminado)'} · ${b.date}</span><b>+${fmt(b.qty)}</b></div>`}).join(''):`<div class="empty">Aún no hay compras registradas.</div>`)+`<script>buyHint()<\/script>`;
}
function buyHint(){const p=prod($('b_p')?.value);if($('b_h')&&p)$('b_h').textContent='Stock actual: '+fmt(p.stock)+' '+unit(p)}
function buy(){
  const p=prod($('b_p').value),q=n($('b_q').value),c=n($('b_c').value);
  if(q<=0)return toast('Escribe una cantidad mayor a 0');
  p.stock=fmt(p.stock+q);
  if(c>0)p.cost=fmt(c/q);
  S.purchases.push({date:today(),pid:p.id,qty:q,cost:c});
  save();render();toast(`Ahora hay ${fmt(p.stock)} ${unit(p)} de ${p.name}`)
}

/* ---------- VENDER ---------- */
function applyItems(items,mult){items.forEach(i=>{const p=prod(i.pid);if(p)p.stock=fmt(p.stock-i.qty*mult)})}
function count(type,id){return todaySales().filter(s=>s.type===type&&s.ref===id).reduce((a,s)=>a+s.qty,0)}
function sell(type,id,d){lastTap=type+id;try{navigator.vibrate&&navigator.vibrate(d>0?18:8)}catch(e){}if(d>0)setTimeout(()=>{const t=document.querySelector('.tapped .qty');if(t){const r=t.getBoundingClientRect(),x=document.createElement('span');x.className='pr';x.textContent='+'+money(price0(type,id));x.style.left=(r.left+10)+'px';x.style.top=(r.top-6)+'px';document.body.appendChild(x);setTimeout(()=>x.remove(),900)}},30);
  let items,price,name;
  if(type==='combo'){const c=S.combos.find(x=>x.id===id);items=c.items;price=c.price;name=c.name}
  else{const p=prod(id);items=[{pid:id,qty:1}];price=p.price;name=p.name}
  if(d>0){
    const short=items.find(i=>{const p=prod(i.pid);return p&&p.stock<i.qty});
    if(short)toast('Aviso: no hay suficiente '+prod(short.pid).name+' en stock');
    applyItems(items,1);S.sales.push({id:uid(),date:today(),type,ref:id,name,qty:1,amount:price});
  }else{
    const i=S.sales.map((s,k)=>[s,k]).reverse().find(([s])=>s.date===today()&&s.type===type&&s.ref===id);
    if(!i)return;S.sales.splice(i[1],1);applyItems(items,-1);
  }
  save();render()
}
function vender(){
  const loose=S.products.filter(p=>p.price>0&&p.unit==='pza');
  if(!S.combos.length&&!loose.length)return `<h1>Ventas del día</h1><div class="card empty">Aún no hay combos ni productos sueltos con precio.<br>Créalos en Catálogo.</div>`;
  const rev=todaySales().reduce((a,s)=>a+s.amount,0);
  const row=(t,id,name,price,sub)=>`<div class="card tile ${lastTap===t+id?'tapped':''}"><div class="em big-em">${emo(name)}</div><div class="ti"><b>${esc(name)}</b><div class="mut">${money(price)}${sub?' · '+sub:''}</div></div><div class="qty"><button class="sec rd" aria-label="Quitar uno" onclick="sell('${t}','${id}',-1)">−</button><b class="cnt">${count(t,id)}</b><button class="rd" aria-label="Agregar uno" onclick="sell('${t}','${id}',1)">+</button></div></div>`;
  return `<h1>Ventas del día</h1><div class="card row"><span>Total de hoy</span><span class="big">${money(rev)}</span></div>
  ${payBreak(todaySales())}<h2>Combos</h2>${S.combos.map(c=>row('combo',c.id,c.name,c.price)).join('')||'<div class="empty">Sin combos.</div>'}
  <h2>Productos sueltos</h2>${loose.map(p=>row('prod',p.id,p.name,p.price,'stock '+fmt(p.stock))).join('')||'<div class="empty">Ningún producto tiene precio de venta suelto.</div>'}
  <div class="mut" style="margin-top:12px">Cada venta descuenta del stock los productos del combo. Los kg se ajustan en el cierre.</div>`;
}

/* ---------- CIERRE ---------- */
function cierre(){
  if(!S.products.length)return `<h1>Cierre del día</h1><div class="card empty">Primero crea productos.</div>`;
  const ts=todaySales(),rev=ts.reduce((a,s)=>a+s.amount,0);
  const sold={};ts.forEach(s=>sold[s.name]=(sold[s.name]||0)+s.qty);
  return `<h1>Cierre del día</h1><div class="mut">Cuenta lo que te queda y escríbelo. Si lo dejas vacío, se asume que coincide con el sistema.</div>
  <div class="card"><div class="row"><span>Dinero generado hoy</span><b class="big">${money(rev)}</b></div>
  <div class="mut">${Object.entries(sold).map(([k,v])=>v+' × '+esc(k)).join(' · ')||'Aún no registraste ventas hoy.'}</div></div>
  ${payBreak(ts)}<h2>Conteo físico</h2>
  ${S.products.map(p=>`<div class="card"><div class="row"><b>${esc(p.name)}</b><span class="mut">Según sistema: ${fmt(p.stock)} ${unit(p)}</span></div><input data-cnt="${p.id}" inputmode="decimal" placeholder="Quedan (${unit(p)})"></div>`).join('')}
  <button style="width:100%;margin-top:8px" onclick="closeDay()">Cerrar el día</button>`;
}
function closeDay(){
  const ts=todaySales(),revenue=ts.reduce((a,s)=>a+s.amount,0);
  if(S.closes.some(c=>c.date===today())&&!confirm('Ya cerraste hoy. ¿Reemplazar el cierre de hoy?'))return;
  let cost=ts.reduce((a,s)=>a+saleCost(s),0);const diffs=[];
  for(const e of document.querySelectorAll('[data-cnt]')){
    if(e.value.trim()==='')continue;
    const v=n(e.value);if(v<0)return toast('No se permiten conteos negativos');
    const p=prod(e.dataset.cnt),d=fmt(v-p.stock);
    if(d!==0)diffs.push({name:p.name,unit:unit(p),expected:p.stock,counted:v,diff:d});
    p.stock=v;
  }
  S.closes=S.closes.filter(c=>c.date!==today());S.closes.push({date:today(),revenue,profit:fmt(revenue-cost),diffs,pays:payTot(ts)});save();
  const lines=diffs.length?diffs.map(d=>`<div class="row"><span>${esc(d.name)}</span><b class="${d.diff<0?'low':'okc'}">${d.diff>0?'+':''}${d.diff} ${d.unit}</b></div>`).join(''):'<div class="okc">Todo cuadra con el sistema ✓</div>';
  dlg(`<h2>Día cerrado ✓</h2><div class="card"><div class="mut">Dinero generado</div><div class="big">${money(revenue)}</div><div class="mut">Ganancia estimada: ${money(revenue-cost)}</div></div>
  <h2>Diferencias (conteo vs. sistema)</h2>${lines}<div class="mut" style="margin-top:8px">Negativo = faltó producto (merma, regalo o error).</div>
  <button style="width:100%;margin-top:12px" onclick="closeDlg();go('inicio')">Listo</button>`);rain();
}
/* ---------- REPORTES ---------- */
let rp=7;
const dstr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function saleCost(s){const it=s.type==='combo'?(S.combos.find(c=>c.id===s.ref)||{items:[]}).items:[{pid:s.ref,qty:1}];return it.reduce((a,i)=>{const p=prod(i.pid);return a+(p?p.cost*i.qty:0)},0)*s.qty}
function setRp(v){rp=v;render()}
function copyCsv(){const t=$('csv');t.select();const ok=()=>toast('Copiado. Pégalo en Excel o Google Sheets');try{navigator.clipboard.writeText(t.value).then(ok,()=>{document.execCommand('copy');ok()})}catch(e){document.execCommand('copy');ok()}}
function reportes(){
  const days=[];for(let i=rp-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(dstr(d))}
  const ss=S.sales.filter(s=>days.includes(s.date));
  const rev=ss.reduce((a,s)=>a+s.amount,0),cost=ss.reduce((a,s)=>a+saleCost(s),0);
  const spent=S.purchases.filter(b=>days.includes(b.date)).reduce((a,b)=>a+b.cost,0);
  const per=days.map(d=>ss.filter(s=>s.date===d).reduce((a,s)=>a+s.amount,0));
  const mx=Math.max(...per,1),top={};
  ss.forEach(s=>{const t=top[s.name]||(top[s.name]={q:0,m:0});t.q+=s.qty;t.m+=s.amount});
  const tl=Object.entries(top).sort((a,b)=>b[1].m-a[1].m).slice(0,8);
  const csv='fecha,tipo,nombre,cantidad,monto,metodo\n'+ss.map(s=>[s.date,s.type,'"'+s.name.replace(/"/g,'""')+'"',s.qty,s.amount,payOf(s)].join(',')).join('\n');
  const btn=(v,l)=>`<button class="${rp===v?'':'sec'} sm" onclick="setRp(${v})">${l}</button>`;
  let h=`<h1>Reportes</h1><div class="row" style="justify-content:flex-start">${btn(1,'Hoy')}${btn(7,'7 días')}${btn(30,'30 días')}</div>
  <div class="grid" style="margin-top:8px"><div class="card"><div class="mut">Ingresos</div><div class="big">${money(rev)}</div></div>
  <div class="card"><div class="mut">Ganancia estimada</div><div class="big ${rev-cost<0?'low':'okc'}">${money(rev-cost)}</div></div>
  <div class="card"><div class="mut">Gastado en compras</div><div class="big">${money(spent)}</div></div>
  <div class="card"><div class="mut">Ventas</div><div class="big">${ss.reduce((a,s)=>a+s.qty,0)}</div></div></div>`;
  if(!ss.length)return h+`<div class="card empty">Aún no hay ventas en este período. Registra la primera en la pestaña Vender.</div>`;
  h+=`${payBreak(ss,'Cobros por método de pago')}<h2>Ingresos por día</h2><div class="card"><div style="display:flex;align-items:flex-end;gap:2px;height:120px">${per.map((v,i)=>`<div title="${days[i]}: ${money(v)}" style="flex:1;height:${Math.max(v?3:0,v/mx*100)}%;background:var(--pri);border-radius:3px 3px 0 0"></div>`).join('')}</div>
  <div style="display:flex;gap:2px;font-size:10px;color:var(--mut);margin-top:4px">${days.map((d,i)=>`<div style="flex:1;text-align:center;overflow:hidden">${rp<=7||i%5===0?d.slice(8):''}</div>`).join('')}</div></div>
  <h2>Lo más vendido</h2>${tl.map(([k,t])=>`<div class="card row"><span>${esc(k)} <span class="tag">${t.q}</span></span><b>${money(t.m)}</b></div>`).join('')}
  <h2>Exportar a Excel</h2><div class="card"><div class="mut">Copia las ventas del período y pégalas en Excel o Google Sheets.</div><textarea id="csv" rows="3" readonly>${esc(csv)}</textarea><button class="sm" style="margin-top:8px" onclick="copyCsv()">Copiar datos</button></div>
  <div class="mut" style="margin-top:8px">La ganancia usa el costo actual de cada producto, por eso es una estimación.</div>`;
  return h;
}
/* ===== ACTUALIZACIÓN v2: pagos, respaldo, ajustes ===== */
const PAYS=[['Pago Móvil','📲','#3d7bff,#1b3fb0'],['Efectivo','💵','#2fbf71,#157a45'],['Divisas','💲','#ffc233,#e08a00'],['Débito','💳','#8a5cff,#4b2bb5'],['Otro','✨','#6c7a99,#3b4766']];
const payOf=s=>PAYS.some(p=>p[0]===s.pay)?s.pay:'Otro';
function payTot(ss){const t={};PAYS.forEach(p=>t[p[0]]=0);ss.forEach(s=>t[payOf(s)]+=s.amount);return t}
function payBreak(ss,title){const t=payTot(ss),tot=Object.values(t).reduce((a,b)=>a+b,0);if(!tot)return '';
  return `<h2>${title||'Cobros de hoy por método'}</h2><div class="card">${PAYS.filter(p=>t[p[0]]>0).map(p=>`<div style="margin:8px 0"><div class="row"><span class="nm"><span class="em">${p[1]}</span>${p[0]}</span><b>${money(t[p[0]])}</b></div><div class="bar"><i style="width:${t[p[0]]/tot*100}%;background:linear-gradient(90deg,${p[2]})"></i></div></div>`).join('')}</div>`}
function embers(){return Array.from({length:12},(_,i)=>`<i class="em2" style="left:${8+i*8}%;--dx:${Math.round(Math.random()*40-20)}px;animation-delay:${(Math.random()*3).toFixed(1)}s;animation-duration:${(2.6+Math.random()*2).toFixed(1)}s"></i>`).join('')}
function render(){nav();$('app').innerHTML=({inicio,vender,comprar,catalogo,cierre,reportes})[tab]()+credit();buyHint()}
function saleItems(s){return s.items||(s.type==='combo'?(S.combos.find(c=>c.id===s.ref)||{items:[]}).items:[{pid:s.ref,qty:1}])}
function saleCost(s){return s.cost!==undefined?s.cost*s.qty:saleItems(s).reduce((a,i)=>{const p=prod(i.pid);return a+(p?p.cost*i.qty:0)},0)*s.qty}
function payDlg(type,id){const x=type==='combo'?S.combos.find(c=>c.id===id):prod(id);if(!x)return;
  dlg(`<h2>¿Cómo pagó el cliente?</h2><div class="card row"><b>${esc(x.name)}</b><b class="big">${money(x.price)}</b></div><div class="pays">${PAYS.map((p,i)=>`<button style="background:linear-gradient(135deg,${p[2]});animation-delay:${i*50}ms;${p[0]==='Divisas'?'color:#1e2b33':''}" onclick="sellDo('${type}','${id}','${p[0]}')"><span>${p[1]}</span>${p[0]}</button>`).join('')}</div><button class="sec" style="width:100%" onclick="closeDlg()">Cancelar</button>`)}
function sell(type,id,d){if(d>0)return payDlg(type,id);lastTap=type+id;
  const i=S.sales.map((s,k)=>[s,k]).reverse().find(([s])=>s.date===today()&&s.type===type&&s.ref===id);if(!i)return;
  S.sales.splice(i[1],1);applyItems(saleItems(i[0]),-1);try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}save();render()}
function sellDo(type,id,pay){closeDlg();lastTap=type+id;const c=type==='combo'?S.combos.find(x=>x.id===id):prod(id);if(!c)return;
  const items=type==='combo'?c.items.map(i=>({pid:i.pid,qty:i.qty})):[{pid:id,qty:1}];
  const sh=items.find(i=>{const p=prod(i.pid);return p&&p.stock<i.qty});
  if(sh){const p=prod(sh.pid);if(!confirm(`Solo quedan ${fmt(p.stock)} ${unit(p)} de ${p.name}. ¿Vender de todos modos?`))return}
  const cost=fmt(items.reduce((a,i)=>{const p=prod(i.pid);return a+(p?p.cost*i.qty:0)},0));
  applyItems(items,1);S.sales.push({id:uid(),date:today(),time:new Date().toTimeString().slice(0,5),type,ref:id,name:c.name,qty:1,amount:c.price,pay,cost,items});
  try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}save();render();
  toast(`${PAYS.find(p=>p[0]===pay)[1]} +${money(c.price)} · ${pay}`);
  setTimeout(()=>{const t=document.querySelector('.tapped .qty');if(!t)return;const r=t.getBoundingClientRect();['🔥','+'+money(c.price),'✨'].forEach((s,k)=>{const x=document.createElement('span');x.className='pr';x.textContent=s;x.style.left=(r.left+k*26-10)+'px';x.style.top=(r.top-6)+'px';x.style.animationDelay=k*90+'ms';document.body.appendChild(x);setTimeout(()=>x.remove(),1100)})},30)}
function buy(){const p=prod($('b_p').value),q=n($('b_q').value),c=n($('b_c').value);if(q<=0)return toast('Escribe una cantidad mayor a 0');
  if(c>0){const b=Math.max(0,p.stock);p.cost=fmt((b*p.cost+c)/(b+q))}
  p.stock=fmt(p.stock+q);S.purchases.push({date:today(),pid:p.id,qty:q,cost:c});save();render();toast(`Ahora hay ${fmt(p.stock)} ${unit(p)} de ${p.name}`)}
function adjForm(id){const p=prod(id);dlg(`<h2>Ajustar stock</h2><div class="mut">${esc(p.name)}: hay ${fmt(p.stock)} ${unit(p)}.</div><label>Qué hacer</label><select id="a_s"><option value="-1">Restar (−)</option><option value="1">Sumar (+)</option></select><label>Cantidad</label><input id="a_q" inputmode="decimal" placeholder="0"><label>Motivo</label><select id="a_r"><option>Merma</option><option>Regalo</option><option>Corrección de conteo</option><option>Otro</option></select><div class="row" style="margin-top:14px"><button class="sec" onclick="closeDlg()">Cancelar</button><button onclick="saveAdj('${id}')">Guardar</button></div>`)}
function saveAdj(id){const p=prod(id),q=n($('a_q').value)*n($('a_s').value);if(!q)return toast('Escribe una cantidad mayor a 0');
  p.stock=fmt(p.stock+q);S.adjusts.push({date:today(),pid:id,delta:q,reason:$('a_r').value});save();closeDlg();render();toast('Stock ajustado')}
function bkBanner(){if(!S.products.length&&!S.sales.length)return '';const d=S.lastBackup?(Date.now()-new Date(S.lastBackup+'T00:00:00'))/864e5:99;
  return d>=7?`<div class="card row" style="border-color:var(--acc)"><span>💾 ${S.lastBackup?'Hace '+Math.floor(d)+' días sin respaldo':'Aún no hay respaldo de tus datos'}</span><button class="sm" onclick="bkForm()">Respaldar</button></div>`:''}
function bkForm(){dlg(`<h2>Respaldo de datos</h2><div class="mut">Copia el texto y guárdalo (WhatsApp a ti mismo, Notas, correo), o intenta descargar el archivo.</div><textarea id="bk" rows="5" readonly>${esc(JSON.stringify(S))}</textarea><div class="row" style="margin-top:10px"><button onclick="bkCopy()">Copiar</button><button class="sec" onclick="bkFile()">Descargar archivo</button></div><button class="sec" style="width:100%;margin-top:10px" onclick="closeDlg()">Cerrar</button>`)}
function bkCopy(){const t=$('bk');t.select();const ok=()=>{S.lastBackup=today();save();toast('Respaldo copiado ✓ Pégalo en un lugar seguro')};try{navigator.clipboard.writeText(t.value).then(ok,()=>{document.execCommand('copy');ok()})}catch(e){document.execCommand('copy');ok()}}
function bkFile(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('bk').value],{type:'application/json'}));a.download='respaldo-fenix-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();toast('Si no se descargó, usa "Copiar"')}catch(e){toast('No se pudo descargar. Usa "Copiar"')}}
function impForm(){dlg(`<h2>Restaurar respaldo</h2><div class="mut">Elige el archivo .json o pega el texto copiado. Reemplaza los datos actuales.</div><input type="file" accept=".json,application/json,text/plain" onchange="impFile(this)"><label>O pega el texto aquí</label><textarea id="i_t" rows="5"></textarea><div class="row" style="margin-top:12px"><button class="sec" onclick="closeDlg()">Cancelar</button><button onclick="impDo()">Restaurar</button></div>`)}
function impFile(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('i_t').value=r.result};r.readAsText(f)}
function impDo(){let o;try{o=JSON.parse($('i_t').value)}catch(e){return toast('El texto no es un respaldo válido')}
  if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales))return toast('Eso no parece un respaldo de la app');
  if(!confirm(`Se reemplazarán los datos actuales por el respaldo (${o.products.length} productos, ${o.sales.length} ventas). ¿Continuar?`))return;
  S=Object.assign(blank(),o);save();closeDlg();render();toast('Respaldo restaurado ✓')}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='rp';s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),600)});

render();countUps();splash();
</script>
